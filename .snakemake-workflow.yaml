usage:
  mandatory-flags:
    desc: >
      DiscoVir is a modular pipeline for viral discovery from sequencing data.
      It requires a config file (--configfile) and a sample list file (accessions.txt).
      The config file defines input/output directories, analysis modules,
      tool parameters, and resource paths for databases (Diamond, Kraken2,
      Krona, MEGAN, etc.).

      To run a test with the default configuration, ensure you have your samples
      listed in `accessions.txt` and execute:
        snakemake --configfile config/config.yaml --sdm conda --cores all

    flags: >-
      --configfile config/config.yaml
  software-stack-deployment:
    conda: true
    apptainer: false
    apptainer+conda: false

testing:
  # Opcional: Define um comando de teste básico para CI/CD ou validação pelo catálogo
  command: >-
    snakemake --configfile config/config.yaml -n --sdm conda
