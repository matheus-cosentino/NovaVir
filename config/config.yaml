# Main output directory
output_dir: "results"

# Add path to sequences of interest
sample_list: "accessions.txt"
data_dir: "data"

### Modules of Analysis to be implemented
modules: 
  download: false  #Perform data download from SRA (default: false)
  quality: true  # Perform reads quality controls (default: true)
  assembly: true # Perform de novo assembly for reads (default: true)
  kraken2: false #Perform taxonomic assignment for Kraken2 (default: false)
  diamond: false #Perform taxonomic assignment for Diamond against nr5 for Reads(default: false)
  duskmatter: false #Perform palm annot identification (default: false)
  reads: false #Perform reads taxonomic identification (default: false)

###
tools:
  denovo: 'spades' # Select your favorite de novo assembly (default: 'spades')
  # options: 
  ##- 'spades'.    # more resourcers needed, but algorythis to better deal with RNA seq data (default)
  ##- 'megahit'    # faster, more error proner
  ##- 'flye'       #indicated for nanopore sequencing long reads

# Envs with tools necessary to use
envs:
  fastp: "workflow/envs/fastp.yaml"
  denovo: "workflow/envs/denovo.yaml"
  diamond:  "workflow/envs/diamond.yaml"
  taxonkit: "workflow/envs/taxonkit.yaml"
  download: "workflow/envs/download.yaml"
  scripts: "workflow/envs/scripts.yaml"
  report: "workflow/envs/report.yaml"
  palm_annot: "workflow/envs/palm_annot.yaml"

# databases and resources for the workflow
resources:
  diamond: "resources/database/NCBI_2025_07_22.dmnd"
  taxonnodes: "resources/database/nodes.dmp"
  taxonnames: "resources/database/names.dmp"
  taxonmap: "resources/database/prot.accession2taxid.gz"
  palm_annot_dir: "resources/palm_annot"
  kraken2_db: "resources/kraken2"
  logo_dirs: "resources/logo/"

params:
  fastp:
    length_required: 15
    qualified_quality_phred: 30
  
  spades:
    algorithm : "--rnaviral" #low resources and correction of RNA artifacts assembly
    #algorithm: "--coronaspades" #indicate for genomic de novo assembly of CoV genomes by HMM guides
    #algorithm: "--meta" #high resources and identification of low assembly

  diamond:
    outfmt: 6
    max_target_seqs: 1
    evalue: 0.00001

  summary:
    rank: "family"
  
  palm_annot: 
    seqtype: "aa" 
    minscore: 50
    minpssmscore: 10


report:
  stat:
    extention:
      - 'txt'
      - 'tsv'
      - 'json'
  graph:
    type:
      - 'dag'
      - 'rulegraph'
      - 'filegraph'
    extention:
      - 'png'
      - 'svg'
      - 'pdf'