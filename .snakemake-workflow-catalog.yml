usage:
  mandatory-flags:
    desc: >
      DiscoVir requires a config file (--configfile) and a sample list file
      (accessions.txt by default, configurable via config["sample_list"]).
      The config file defines input/output directories, analysis modules,
      tool parameters, and resource paths for databases (Diamond, Kraken2,
      Krona, MEGAN, etc.).
      Example run:
        snakemake --configfile config/config.yaml --sdm conda --cores 8
    flags: >-
      --configfile config/config.yaml
  software-stack-deployment:
    conda: true
    apptainer: false
    apptainer+conda: false
